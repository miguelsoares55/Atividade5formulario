<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Atividade - HTML e CSS: Formulário</title>
 
  <style>
    * { box-sizing: border-box; }
 
    body {
      font-family: Arial, Helvetica, sans-serif;
      background-color: #434343;
      color: #333333;
      margin: 0;
      padding: 24px 16px 48px;
    }
 
    .conteudo { max-width: 720px; margin: 0 auto; }
 
    h1 {
      font-family: Georgia, "Times New Roman", serif;
      font-size: 1.7rem;
      color: #f26522;
      background-color: #ffffff;
      border: 2px solid #000000;
      border-radius: 8px;
      margin: 0 0 28px;
      padding: 14px 24px;
    }
 
    .formulario {
      background-color: #ffffff;
      border-radius: 16px;
      padding: 32px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.35);
    }
 
    .formulario h2 { font-size: 1.3rem; color: #f26522; margin: 0 0 4px; }
    .intro { margin: 0 0 24px; color: #666666; font-size: 0.95rem; }
 
    .grade { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
    .campo { display: flex; flex-direction: column; gap: 6px; }
    .campo.largo { grid-column: 1 / -1; }
 
    label, legend { font-size: 0.9rem; font-weight: bold; color: #333333; }
    .dica { font-size: 0.8rem; color: #777777; }
 
    .campo > input,
    .campo > select,
    .campo > textarea {
      width: 100%;
      font: inherit;
      font-size: 1rem;
      color: #333333;
      background-color: #ffffff;
      padding: 11px 14px;
      border: 2px solid #d0d0d0;
      border-radius: 10px;
      transition: border-color 0.2s, box-shadow 0.2s;
    }
 
    textarea { resize: vertical; min-height: 110px; }
 
    .campo > input[type="file"] {
      font-size: 0.95rem;
      color: #555555;
      background-color: #fafafa;
      padding: 8px;
      border-style: dashed;
    }
 
    .campo > input:hover,
    .campo > select:hover,
    .campo > textarea:hover { border-color: #f7a97c; }
 
    .campo > input:focus,
    .campo > select:focus,
    .campo > textarea:focus {
      outline: none;
      border-color: #f26522;
      box-shadow: 0 0 0 4px rgba(242, 101, 34, 0.2);
    }
 
    input[type="file"]::file-selector-button {
      font: inherit;
      font-weight: bold;
      color: #ffffff;
      background-color: #f26522;
      border: none;
      border-radius: 8px;
      padding: 8px 16px;
      margin-right: 12px;
      cursor: pointer;
      transition: background-color 0.2s;
    }
 
    input[type="file"]::file-selector-button:hover { background-color: #d94f10; }
 
    fieldset {
      margin: 0;
      padding: 12px 16px 16px;
      border: 2px solid #d0d0d0;
      border-radius: 10px;
      min-width: 0;
    }
 
    fieldset:focus-within { border-color: #f26522; }
    legend { padding: 0 6px; }
 
    .opcoes { display: flex; flex-wrap: wrap; gap: 10px 22px; padding-top: 4px; }
 
    .opcao {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-weight: normal;
      font-size: 0.95rem;
      cursor: pointer;
    }
 
    .opcao input {
      width: 18px;
      height: 18px;
      margin: 0;
      accent-color: #f26522;
      cursor: pointer;
    }
 
    .opcao input:focus { outline: none; box-shadow: 0 0 0 4px rgba(242, 101, 34, 0.2); }
 
    .botoes { display: flex; justify-content: flex-end; gap: 12px; margin-top: 28px; }
 
    button {
      font: inherit;
      font-size: 1rem;
      font-weight: bold;
      padding: 12px 28px;
      border: 2px solid #f26522;
      border-radius: 10px;
      cursor: pointer;
      transition: background-color 0.2s, color 0.2s, transform 0.2s, box-shadow 0.2s;
    }
 
    .enviar { color: #ffffff; background-color: #f26522; }
 
    .enviar:hover {
      background-color: #d94f10;
      border-color: #d94f10;
      transform: translateY(-2px);
      box-shadow: 0 6px 14px rgba(242, 101, 34, 0.4);
    }
 
    .limpar { color: #f26522; background-color: #ffffff; }
    .limpar:hover { color: #ffffff; background-color: #f26522; transform: translateY(-2px); }
 
    button:focus-visible { outline: none; box-shadow: 0 0 0 4px rgba(242, 101, 34, 0.35); }
    button:active { transform: translateY(0); }
 
    @media (max-width: 640px) {
      body { padding: 16px 12px 32px; }
      h1 { font-size: 1.3rem; padding: 12px 16px; }
      .formulario { padding: 22px 18px; }
      .grade { grid-template-columns: 1fr; gap: 18px; }
      .botoes { flex-direction: column-reverse; }
      button { width: 100%; }
    }
  </style>
</head>
<body>
 
  <div class="conteudo">
 
    <h1>Atividade - HTML e CSS: Formulário</h1>
 
    <form class="formulario" action="#" method="get">
      <h2>Formulário de Cadastro</h2>
      <p class="intro">Preencha os campos abaixo. Os campos com * são obrigatórios.</p>
 
      <div class="grade">
 
        <div class="campo largo">
          <label for="nome">Nome *</label>
          <input type="text" id="nome" name="nome" placeholder="Digite seu nome completo" autocomplete="name" required>
        </div>
 
        <div class="campo">
          <label for="email">E-mail *</label>
          <input type="email" id="email" name="email" placeholder="exemplo@email.com" autocomplete="email" required>
        </div>
 
        <div class="campo">
          <label for="senha">Senha *</label>
          <input type="password" id="senha" name="senha" placeholder="Crie uma senha" minlength="6" autocomplete="new-password" required>
          <span class="dica">Use no mínimo 6 caracteres.</span>
        </div>
 
        <div class="campo">
          <label for="nascimento">Data de nascimento *</label>
          <input type="date" id="nascimento" name="nascimento" required>
        </div>
 
        <div class="campo">
          <label for="curso">Curso *</label>
          <select id="curso" name="curso" required>
            <option value="" selected disabled>Selecione um curso</option>
            <option value="desenvolvimento">Desenvolvimento de Sistemas</option>
            <option value="informatica">Informática</option>
            <option value="design">Design Gráfico</option>
            <option value="administracao">Administração</option>
            <option value="engenharia">Engenharia de Software</option>
            <option value="ciencia">Ciência da Computação</option>
            <option value="outro">Outro</option>
          </select>
        </div>
 
        <div class="campo largo">
          <fieldset>
            <legend>Sexo *</legend>
            <div class="opcoes">
              <label class="opcao"><input type="radio" name="sexo" value="feminino" required> Feminino</label>
              <label class="opcao"><input type="radio" name="sexo" value="masculino"> Masculino</label>
              <label class="opcao"><input type="radio" name="sexo" value="outro"> Outro</label>
              <label class="opcao"><input type="radio" name="sexo" value="nao-informar"> Prefiro não informar</label>
            </div>
          </fieldset>
        </div>
 
        <div class="campo largo">
          <fieldset>
            <legend>Interesses</legend>
            <div class="opcoes">
              <label class="opcao"><input type="checkbox" name="interesses" value="programacao"> Programação</label>
              <label class="opcao"><input type="checkbox" name="interesses" value="design"> Design</label>
              <label class="opcao"><input type="checkbox" name="interesses" value="jogos"> Jogos</label>
              <label class="opcao"><input type="checkbox" name="interesses" value="musica"> Música</label>
              <label class="opcao"><input type="checkbox" name="interesses" value="esportes"> Esportes</label>
              <label class="opcao"><input type="checkbox" name="interesses" value="leitura"> Leitura</label>
            </div>
          </fieldset>
        </div>
 
        <div class="campo largo">
          <label for="comentarios">Comentários</label>
          <textarea id="comentarios" name="comentarios" rows="4" placeholder="Escreva aqui seus comentários..."></textarea>
        </div>
 
        <div class="campo largo">
          <label for="foto">Upload de foto</label>
          <input type="file" id="foto" name="foto" accept="image/*">
        </div>
 
      </div>
 
      <div class="botoes">
        <button type="reset" class="limpar">Limpar</button>
        <button type="submit" class="enviar">Enviar</button>
      </div>
    </form>
 
  </div>
 
</body>
</html>
